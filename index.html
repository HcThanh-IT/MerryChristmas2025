  <style>
#photoSection { 
    width:100%; 
    margin-top:40px; 
    display:none; 
}

.photo-row { 
    white-space:nowrap; 
    overflow:hidden; 
    display:flex; 
    gap:20px; 
    padding:30px 0; 
}

.photo-row img { 
    height:150px; 
    width:150px; 
    object-fit:cover; 
    border-radius:12px; 
}

/* Hàng 1: bắt đầu từ PHẢI → chạy sang trái */
.row1 { 
    animation: slideLeft 40s linear infinite; 
}

/* Hàng 2: bắt đầu từ TRÁI → chạy sang phải */
.row2 { 
    animation: slideRight 20s linear infinite; 
}

/* HÀNG TRÊN: từ phải → trái */
@keyframes slideLeft {
    0%   { transform: translateX(100%); }    /* bắt đầu ngoài mép phải */
    100% { transform: translateX(-100%); }   /* chạy qua hết sang trái */
}

/* HÀNG DƯỚI: từ trái → phải */
@keyframes slideRight {
    0%   { transform: translateX(-100%); }   /* bắt đầu ngoài mép trái */
    100% { transform: translateX(100%); }    /* chạy qua hết sang phải */
}
</style>

<div id="photoSection">
    <div class="photo-row row1">
        <img src="./img/2.jpg"><img src="./img/4.jpg"><img src="./img/6.jpg">
        <img src="./img/8.jpg"><img src="./img/10.jpg"><img src="./img/12.jpg">
        <img src="./img/3.jpg"><img src="./img/5.jpg"><img src="./img/7.jpg">
        <img src="./img/9.jpg"><img src="./img/11.jpg"><img src="./img/12.jpg">
        <img src="./img/10.jpg">
    </div>

    <div class="photo-row row2">
        <img src="./img/2.jpg"><img src="./img/5.jpg"><img src="./img/7.jpg">
        <img src="./img/6.jpg"><img src="./img/3.jpg"><img src="./img/10.jpg">
        <img src="./img/8.jpg"><img src="./img/4.jpg"><img src="./img/12.jpg">
        <img src="./img/2.jpg"><img src="./img/10.jpg"><img src="./img/11.jpg">
        <img src="./img/3.jpg"> 
    </div>
</div>
